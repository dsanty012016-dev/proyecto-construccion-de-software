name: CI

# Revisa el proyecto en cada subida: lint, pruebas, build y la base de datos.
on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Cuando exista package-lock.json, cambiar a "npm ci" para instalaciones exactas.
      - name: Instalar dependencias
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Pruebas de las reglas del viaje
        run: npm test

      - name: Build (incluye revisión de tipos)
        run: npm run build

      # Dependencias de la app con fallas de seguridad conocidas (altas o críticas).
      # Cada falla sale como aviso en el resumen de GitHub (paquete, gravedad y arreglo).
      - name: Auditoría de dependencias
        run: |
          npm audit --omit=dev --json > auditoria.json || true
          node -e '
            const r = require("./auditoria.json");
            const v = Object.values(r.vulnerabilities ?? {});
            for (const x of v) {
              const via = x.via.map((y) => (typeof y === "string" ? y : y.title)).join(" / ");
              const arreglo = x.fixAvailable === true ? "npm audit fix" : x.fixAvailable ? `${x.fixAvailable.name}@${x.fixAvailable.version}` : "sin arreglo";
              console.log(`::warning::${x.severity} · ${x.name} ${x.range} · ${via} · ${arreglo}`);
            }
            const graves = v.filter((x) => x.severity === "high" || x.severity === "critical");
            if (graves.length > 0) { console.log(`::error::${graves.length} dependencias con fallas altas o críticas`); process.exit(1); }
          '

  base-de-datos:
    # Corre las migraciones y las pruebas de seguridad (RLS y RPC) en un
    # Postgres vacío que imita lo mínimo de Supabase.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Migraciones y pruebas de la base
        run: ./supabase/pruebas/correr.sh
